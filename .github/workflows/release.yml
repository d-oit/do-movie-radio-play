name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & Attest Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev

      - name: Validate VERSION and Annotated Tag
        run: bash scripts/check_version.sh "${{ github.ref_name }}"

      - name: Build Release Binary
        run: cargo build --release -p movie-radio-timeline

      - name: Package Release Artifacts
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)

          mkdir -p dist/binary
          cp target/release/timeline dist/binary/
          if [[ -f README.md ]]; then cp README.md dist/binary/; fi
          if [[ -f LICENSE ]]; then cp LICENSE dist/binary/; fi
          tar -czvf "movie-radio-timeline-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C dist/binary .

          mkdir -p dist/schemas
          cp schema/*.schema.json dist/schemas/
          tar -czvf "schemas-v${VERSION}.tar.gz" -C dist/schemas .

      - name: Smoke Check Release Artifacts
        run: |
          ./dist/binary/timeline --help
          test -f dist/schemas/timeline.schema.json

      - name: Generate CycloneDX SBOM
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          cargo install cargo-cyclonedx --version 0.5.9
          cargo cyclonedx --manifest-path crates/movie-radio-timeline/Cargo.toml --format json --override-filename "sbom-v${VERSION}"
          mv "crates/movie-radio-timeline/sbom-v${VERSION}.cdx.json" "sbom-v${VERSION}.cdx.json"

      - name: Generate SHA-256 Checksums
        run: |
          sha256sum movie-radio-timeline-*.tar.gz schemas-*.tar.gz sbom-*.cdx.json > SHA256SUMS

      - name: Attest Artifact Build Provenance
        uses: actions/attest-build-provenance@c0744595b7e324080eb2ed189baec9bfbc31ff3d # v2.2.3
        with:
          subject-path: |
            movie-radio-timeline-*.tar.gz
            schemas-*.tar.gz

      - name: Attest SBOM
        uses: actions/attest-sbom@73ec18d360ef3c67c51dd588b50ea8a264e1c251 # v2.2.3
        with:
          subject-path: |
            movie-radio-timeline-*.tar.gz
            schemas-*.tar.gz
          sbom-path: |
            sbom-*.cdx.json

      - name: Upload Artifacts to Action Run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: |
            movie-radio-timeline-*.tar.gz
            schemas-*.tar.gz
            sbom-*.cdx.json
            SHA256SUMS
            schema/*.schema.json

  verify:
    name: Verify Release Artifacts & Attestations
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@cc3a90e038228308d96b32bf52f1e29e92d04a62 # v4.1.9
        with:
          name: release-artifacts

      - name: Verify SHA-256 Checksums
        run: sha256sum -c SHA256SUMS

      - name: Verify Provenance and SBOM Attestations
        run: |
          for archive in movie-radio-timeline-*.tar.gz schemas-*.tar.gz; do
            echo "Verifying attestation for ${archive}..."
            gh attestation verify "${archive}" --repo "${{ github.repository }}"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@cc3a90e038228308d96b32bf52f1e29e92d04a62 # v4.1.9
        with:
          name: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.2.1
        with:
          files: |
            movie-radio-timeline-*.tar.gz
            schemas-*.tar.gz
            sbom-*.cdx.json
            SHA256SUMS
            schema/*.schema.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[package]
name = "movie-radio-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TTS voice synthesis providers"

[dependencies]
movie-radio-types.workspace = true
anyhow.workspace = true
async-trait.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The audio.cpp CLI provider writes and reads temporary files, so `fs` is
# required here directly: it previously arrived transitively through
# qwen_tts -> hf-hub -> reqwest, which no longer happens now that qwen_tts is
# an optional dependency.
tokio = { workspace = true, features = ["fs"] }
ort = { workspace = true, optional = true }
reqwest.workspace = true
tempfile.workspace = true
base64.workspace = true
symphonia.workspace = true
llama-cpp-2 = { version = "0.1", optional = true }
once_cell = "1"
rand = "0.10"
qwen_tts = { version = "0.1", default-features = false, optional = true }
candle-core = { version = "0.9", optional = true }

[features]
default = []
# In-process local inference pulls heavy native toolchains: llama.cpp (built
# with CMake, bindgen against libclang) plus ONNX Runtime for Orpheus' SNAC
# vocoder, and candle for Qwen3. Keep them opt-in so a default build only
# compiles the HTTP providers; the `Test Local TTS Features` CI job exercises
# them, as does `cargo clippy --workspace --all-features`.
#
# Kokoro is an HTTP provider (it dials a local endpoint), so it needs no
# native dependency and stays available in the default build.
orpheus = ["dep:llama-cpp-2", "dep:ort"]
qwen3 = ["dep:qwen_tts", "dep:candle-core"]
local-tts = ["orpheus", "qwen3"]

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true

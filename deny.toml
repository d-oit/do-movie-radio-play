# deny.toml - cargo-deny supply chain security (from d-oit/rust-2026-template)
# Run: cargo deny check

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = [
  "RUSTSEC-2025-0119",  # number_prefix unmaintained — transitive dep of candle
  "RUSTSEC-2024-0436",  # paste unmaintained — transitive dep of tokenizers
  "RUSTSEC-2026-0367",  # zip transitive dep
  "RUSTSEC-2026-0368",  # zip transitive dep
  "RUSTSEC-2026-0369",  # zip transitive dep
  "RUSTSEC-2026-0381",  # webpki-roots 0.26 transitive dep of ureq 2
  # zip 7.4.0 <= qwen_tts -> candle-core 0.9.2 -> zip ^7.2.0. The fix needs
  # zip >= 9.0.0; only candle-core >= 0.11 accepts that, and qwen_tts 0.1.1
  # requires candle ^0.9, so no resolvable upgrade exists. The advisory covers
  # `ZipArchive::extract()` on a symlink entry; candle-core only uses
  # `ZipArchive::new` + `by_index` and this workspace never opens untrusted
  # archives. Remove this line once qwen_tts allows candle 0.11.
  "RUSTSEC-2026-0429",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "BSL-1.0",
  "OpenSSL",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[[bans.skip]]
name = "symphonia"
# rodio 0.22 still depends on symphonia 0.5.5; our workspace uses 0.6
# Remove this skip once rodio upgrades to symphonia 0.6

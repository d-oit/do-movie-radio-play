[package]
name = "movie-radio-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TTS voice synthesis providers"

[dependencies]
movie-radio-types.workspace = true
anyhow.workspace = true
async-trait.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs"] }
ort = { workspace = true, optional = true }
reqwest.workspace = true
tempfile.workspace = true
symphonia.workspace = true
llama-cpp-2 = { version = "0.1", optional = true }
once_cell = "1"
rand = "0.10"
qwen_tts = { version = "0.1", default-features = false, optional = true }
candle-core = { version = "0.9", optional = true }

[features]
default = []
kokoro = ["dep:ort"]
orpheus = ["dep:llama-cpp-2"]
qwen3 = ["dep:qwen_tts", "dep:candle-core"]
local-tts = ["kokoro", "orpheus", "qwen3"]

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true

name: Benchmark Sweep

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 5"

permissions:
  contents: read

jobs:
  benchmark_sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev
      - run: bash scripts/fetch_test_assets.sh
      - run: cargo run --quiet -- gen-fixtures --output-dir testdata/generated
      - name: Generate benchmark candidate
        run: bash scripts/benchmark.sh testdata/raw/elephants_dream_2006.mp4 analysis/benchmarks/latest-candidate.json
      - name: Check benchmark regression
        run: |
          python3 scripts/check_benchmark_regression.py \
            --baseline analysis/benchmarks/latest.json \
            --candidate analysis/benchmarks/latest-candidate.json
      - name: Run criterion benchmark suite
        run: cargo bench -p benchmarks --bench pipeline_bench -- --noplot
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-sweep-results
          path: analysis/benchmarks/
